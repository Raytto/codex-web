name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: sudo apt-get update && sudo apt-get install -y acl age python3
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run test:storage-tools
      - run: cp .env.example .env && docker compose config --quiet
