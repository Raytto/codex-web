# Generic reverse-proxy template. Replace `server_name` and certificate paths
# in the operator's private deployment; never commit those values here.
log_format codex_web_remote_worker '$remote_addr $request_method $uri $status $body_bytes_sent';
limit_conn_zone $binary_remote_addr zone=codex_web_remote_worker_connections:10m;
limit_req_zone $binary_remote_addr zone=codex_web_remote_worker_transfers:10m rate=8r/s;

server {
    listen 443 ssl;
    server_name _;
    client_max_body_size 100m;

    location / {
        proxy_pass http://127.0.0.1:37821;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade "";
        proxy_set_header Connection "close";
        proxy_read_timeout 1800s;
        proxy_buffering off;
    }

    location /api/remote-workers/ {
        access_log /var/log/nginx/codex-web-remote-worker.log codex_web_remote_worker;
        limit_conn codex_web_remote_worker_connections 8;
        limit_req zone=codex_web_remote_worker_transfers burst=16 nodelay;
        proxy_pass http://127.0.0.1:37821;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Upgrade "";
        proxy_set_header Connection "close";
        proxy_read_timeout 1800s;
        proxy_buffering off;
    }
}
