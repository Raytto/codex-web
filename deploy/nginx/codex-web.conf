# Voice latency metadata only: no request body, cookies or signed query strings.
log_format codex_web_voice '$request_id $request_method $uri $status '
    'bytes=$request_length request_time=$request_time upstream_time=$upstream_response_time';
map $uri $codex_web_voice_request {
    default 0;
    ~^/codex-web/api/transcriptions$ 1;
    ~^/codex-web/api/transcription-audio/ 1;
    ~^/codex-web/api/conversations/[^/]+/voice-messages$ 1;
}

# Generic reverse-proxy template. Replace `server_name` and certificate paths
# in the operator's private deployment; never commit those values here.
log_format codex_web_remote_worker '$remote_addr $request_method $uri $status $body_bytes_sent';
limit_conn_zone $binary_remote_addr zone=codex_web_remote_worker_connections:10m;
limit_req_zone $binary_remote_addr zone=codex_web_remote_worker_transfers:10m rate=8r/s;

server {
    listen 443 ssl;
    server_name _;
    client_max_body_size 2g;
    access_log /var/log/nginx/codex-web-voice.log codex_web_voice if=$codex_web_voice_request;

    location /codex-web/ {
        proxy_pass http://127.0.0.1:37821;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade "";
        proxy_set_header Connection "close";
        proxy_read_timeout 1800s;
        proxy_send_timeout 1800s;
        client_body_timeout 1800s;
        proxy_buffering off;
    }

    location /codex-web/api/remote-workers/ {
        access_log /var/log/nginx/codex-web-remote-worker.log codex_web_remote_worker;
        limit_conn codex_web_remote_worker_connections 8;
        limit_req zone=codex_web_remote_worker_transfers burst=16 nodelay;
        proxy_pass http://127.0.0.1:37821;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Upgrade "";
        proxy_set_header Connection "close";
        proxy_read_timeout 1800s;
        proxy_send_timeout 1800s;
        client_body_timeout 1800s;
        proxy_buffering off;
    }

    location = /codex-web/api/remote-workers/connect {
        access_log /var/log/nginx/codex-web-remote-worker.log codex_web_remote_worker;
        limit_conn codex_web_remote_worker_connections 8;
        proxy_pass http://127.0.0.1:37821;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 1800s;
        proxy_send_timeout 1800s;
        client_body_timeout 1800s;
        proxy_buffering off;
    }

    location = /codex-web/api/node-transfers/connect {
        access_log /var/log/nginx/codex-web-remote-worker.log codex_web_remote_worker;
        limit_conn codex_web_remote_worker_connections 8;
        proxy_pass http://127.0.0.1:37821;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 1800s;
        proxy_send_timeout 1800s;
        client_body_timeout 1800s;
        proxy_buffering off;
    }

}
